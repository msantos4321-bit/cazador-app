<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cazador de Ofertas</title>
<meta name="description" content="Vigila precios en México y Estados Unidos y te avisa cuándo conviene comprar.">
<meta name="theme-color" content="#1C1F45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ofertas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F5F5FA;--tarjeta:#FFFFFF;--tinta:#191B33;--suave:#5F6380;--linea:#E4E5EF;
  --marino:#1C1F45;--acento:#3F44C9;--mantequilla:#F2DFA0;
  --verde-f:#E6F2EA;--verde-t:#1F6F4A;--amarillo-f:#FBF1D4;--amarillo-t:#6B4E0A;--rojo-f:#FBEBE5;--rojo-t:#9A3412;--gris-f:#EEEEF5;--gris-t:#3B3E5C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#11132A;--tarjeta:#1A1D3A;--tinta:#EEEFF8;--suave:#A6A9C8;--linea:#2C3058;
    --marino:#262A5E;--acento:#A9ADFF;--mantequilla:#F2DFA0;
    --verde-f:#16362A;--verde-t:#8FE0B4;--amarillo-f:#3A3016;--amarillo-t:#F2D88A;--rojo-f:#3D1F18;--rojo-t:#FFB59A;--gris-f:#262A4A;--gris-t:#C9CBEA;
  }
}
:root[data-theme="dark"]{
  --fondo:#11132A;--tarjeta:#1A1D3A;--tinta:#EEEFF8;--suave:#A6A9C8;--linea:#2C3058;
  --marino:#262A5E;--acento:#A9ADFF;
  --verde-f:#16362A;--verde-t:#8FE0B4;--amarillo-f:#3A3016;--amarillo-t:#F2D88A;--rojo-f:#3D1F18;--rojo-t:#FFB59A;--gris-f:#262A4A;--gris-t:#C9CBEA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'DM Sans',system-ui,sans-serif;font-size:18px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:24px 16px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,.titulo,.precio,.precio-grande{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:500}
h1{font-size:32px;letter-spacing:-.7px;line-height:1.1;margin:0;outline:none}
h2{font-size:22px;margin:0}
p{margin:0}
.ceja{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--suave);font-weight:600;margin:0}
.suave{color:var(--suave)}.pequeno{font-size:15px}.centro{text-align:center}
.titulo{font-size:20px;line-height:1.2}
.pila{display:flex;flex-direction:column;gap:12px}
label{font-weight:600}
input,textarea{font:inherit;font-size:20px;color:var(--tinta);background:var(--tarjeta);border:2px solid var(--linea);border-radius:16px;padding:14px 16px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--acento)}
textarea{resize:none}
.codigo{font-size:32px;letter-spacing:12px;text-align:center}
.boton{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 22px;border-radius:999px;border:2px solid var(--linea);background:var(--tarjeta);color:var(--tinta);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;text-align:center}
.boton.principal{background:var(--acento);border-color:var(--acento);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .boton.principal{color:#11132A}}
.boton.claro{background:#F5F5FA;border-color:#F5F5FA;color:#1C1F45;align-self:flex-start}
.boton:disabled{opacity:.6}
.boton:focus-visible,.opcion:focus-visible,a:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.volver{align-self:flex-start;background:none;border:0;padding:8px 0;font:inherit;font-size:18px;color:var(--acento);text-decoration:none;cursor:pointer;min-height:44px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;color:inherit;text-decoration:none}
a.tarjeta:active{transform:scale(.99)}
.cabeza{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.insignia{font-size:15px;font-weight:600;border-radius:999px;padding:6px 12px;white-space:nowrap;font-family:'DM Sans',sans-serif}
.insignia.verde{background:var(--verde-f);color:var(--verde-t)}.insignia.amarillo{background:var(--amarillo-f);color:var(--amarillo-t)}
.insignia.rojo{background:var(--rojo-f);color:var(--rojo-t)}.insignia.gris{background:var(--gris-f);color:var(--gris-t)}
.insignia.verde::before{content:"● "}.insignia.amarillo::before{content:"● "}.insignia.rojo::before{content:"● "}
.precio-linea{font-size:20px;font-weight:600}
.precio-grande{font-size:36px;letter-spacing:-.8px;line-height:1.1}
.precio-grande .suave{display:block;font-size:22px;letter-spacing:0;margin-top:4px}
.heroe{background:var(--marino);color:#F5F5FA;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:10px}
.heroe .ceja{color:#C9CBEA}.heroe .precio{font-size:48px;letter-spacing:-1.4px;color:var(--mantequilla);line-height:1}
.solicitud{border-style:dashed}.solicitud.lista{border:2px solid var(--acento)}
.vacio{text-align:center;display:flex;flex-direction:column;gap:12px;padding:32px 8px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-size:16px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta);border-radius:999px;padding:10px 16px;cursor:pointer;min-height:44px}
.opciones{display:flex;flex-direction:column;gap:12px}
.opcion{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;font-size:20px;font-weight:600;color:var(--tinta);background:var(--tarjeta);border:2px solid var(--linea);border-radius:20px;padding:18px 20px;min-height:72px;cursor:pointer}
.opcion .suave{font-size:16px;font-weight:400}
.opcion:active{border-color:var(--acento)}
.puntos{display:flex;gap:6px}.puntos span{height:6px;flex:1;border-radius:3px;background:var(--linea)}.puntos span.lleno{background:var(--acento)}
.con-microfono{position:relative}.con-microfono textarea{padding-right:72px}
.microfono{position:absolute;right:8px;top:8px;width:56px;height:56px;border-radius:50%;border:0;background:var(--gris-f);font-size:26px;cursor:pointer}
.microfono.escuchando{background:var(--rojo-f);animation:latido 1s infinite}
@keyframes latido{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.microfono.escuchando{animation:none}}
.destacada{border:2px solid var(--acento)}
.nota{background:var(--amarillo-f);color:var(--amarillo-t);border-radius:16px;padding:12px 14px}
ul.umbrales,ul.tiendas{list-style:none;margin:0;padding:0}
ul.umbrales li,ul.tiendas li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linea)}
ul.tiendas li>span:first-child{display:flex;flex-direction:column}
ul.tiendas li.mejor a{font-weight:700}
.num{text-align:right;white-space:nowrap}
a{color:var(--acento)}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--tarjeta);border-top:1px solid var(--linea);display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.barra a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:var(--suave);text-decoration:none;min-width:88px;min-height:52px;justify-content:center;font-weight:600}
.barra a span{font-size:22px}
.barra a.activa{color:var(--acento)}
.barra a.grande{background:var(--acento);color:#fff;border-radius:999px;padding:6px 18px;flex-direction:row;gap:8px;font-size:17px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .barra a.grande{color:#11132A}}
.aviso{position:fixed;left:16px;right:16px;bottom:96px;max-width:528px;margin:0 auto;background:var(--marino);color:#fff;border-radius:16px;padding:14px 16px;font-weight:600;z-index:10}
.aviso.error{background:var(--rojo-t);color:#fff}
.entrar{padding-top:56px}
</style>
</head>
<body>
<div id="app"><main><p class="ceja">Cazador de Ofertas</p><h1>Cargando…</h1></main></div>
<noscript><p style="padding:16px">Esta app necesita JavaScript activado.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
